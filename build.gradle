plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.xl1te'
version = '0.3.1'
description = 'A powerful moderation panel for your Minecraft server.'

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    mavenCentral()
}

dependencies {
    // Supplied at runtime by Bukkit / plugin.yml libraries
    compileOnly 'org.spigotmc:spigot-api:1.19-R0.1-SNAPSHOT'
    compileOnly 'com.h2database:h2:2.5.252'
    compileOnly 'com.google.code.gson:gson:2.15.0'
    compileOnly 'io.javalin:javalin:7.2.4'
    compileOnly 'net.dv8tion:JDA:6.7.0'
    compileOnly 'com.zaxxer:HikariCP:7.1.0'

    // Shaded into the plugin jar
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'
    implementation 'org.mariadb.jdbc:mariadb-java-client:4.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

def tailwindOutput = layout.buildDirectory.file('generated/tailwind/public/css/app.css')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('npmInstall', Exec) {
    workingDir = projectDir
    commandLine(isWindows ? ['cmd', '/c', 'npm ci'] : ['npm', 'ci'])
    inputs.files('package.json', 'package-lock.json')
    outputs.dir('node_modules')
}

tasks.register('tailwindBuild', Exec) {
    dependsOn 'npmInstall'
    workingDir = projectDir
    def tailwindArgs = ['@tailwindcss/cli', '-i', 'src/main/tailwind/input.css',
                        '-o', tailwindOutput.get().asFile.absolutePath, '--minify']
    commandLine(isWindows ? ['cmd', '/c', 'npx'] + tailwindArgs : ['npx'] + tailwindArgs)
    inputs.dir('src/main/tailwind')
    inputs.dir('src/main/resources/public')
    inputs.files('package.json', 'package-lock.json')
    outputs.file(tailwindOutput)
    outputs.upToDateWhen { false }
    ignoreExitValue = true
    standardOutput = new ByteArrayOutputStream()
    errorOutput = new ByteArrayOutputStream()
    doLast {
        def stdout = standardOutput.toString('UTF-8')
        def stderr = errorOutput.toString('UTF-8')
        if (stdout) { print(stdout) }
        if (stderr) { System.err.print(stderr) }
        def exitCode = executionResult.get().exitValue
        if (exitCode != 0) {
            throw new GradleException("tailwindcss failed with exit code ${exitCode}")
        }
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/tailwind'))
tasks.named('processResources') {
    dependsOn 'tailwindBuild'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    relocate 'org.bstats', 'com.xl1te.modpanel.bstats'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
