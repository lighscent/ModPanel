<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModPanel - Login</title>
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-bg p-6">
    <div class="w-full max-w-[380px] rounded-md border border-line bg-panel p-8">
      <img class="mx-auto mb-4 block size-10 rounded-[10px] object-cover" src="../img/modpanel_500px.png" alt="ModPanel" />
      <div class="text-center text-[19px] font-semibold">ModPanel</div>
      <div class="mb-6 mt-0.5 text-center text-[13px] text-dim">Moderation Control Panel</div>
      <form id="loginForm">
        <div class="mb-3.5">
          <label for="username" class="mb-1 block text-[13px] font-semibold text-dim">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required
                 class="w-full rounded border border-[#4a525d] bg-[#23272d] px-3 py-2 text-[15px] text-ink outline-none transition focus:border-accent focus:ring-[3px] focus:ring-accent/20" />
        </div>
        <div class="mb-3.5">
          <label for="password" class="mb-1 block text-[13px] font-semibold text-dim">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
                 class="w-full rounded border border-[#4a525d] bg-[#23272d] px-3 py-2 text-[15px] text-ink outline-none transition focus:border-accent focus:ring-[3px] focus:ring-accent/20" />
        </div>
        <button type="submit" id="loginBtn"
                class="mt-1.5 flex w-full items-center justify-center gap-2 rounded bg-accent py-2.5 text-[15px] font-semibold text-white transition hover:bg-accent-dark disabled:cursor-not-allowed disabled:opacity-60">
          <span id="loginText">Sign In</span>
          <div id="spinner" style="display:none" class="size-4 animate-spin rounded-full border-2 border-white/45 border-t-white"></div>
        </button>
      </form>
      <div id="errorMsg" style="display:none" class="mt-3 rounded border border-red-500/35 bg-red-500/15 px-2.5 py-2 text-center text-[13px] text-red-300"></div>
    </div>
    <script>
      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const loginText = document.getElementById('loginText');
      const spinner = document.getElementById('spinner');
      const errorMsg = document.getElementById('errorMsg');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        loginBtn.disabled = true;
        loginText.style.display = 'none';
        spinner.style.display = 'block';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            })
          });
          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            // Session posée par cookie HttpOnly (Set-Cookie) : rien à stocker côté JS.
            window.location.href = '/dashboard';
          } else {
            showError(data.error || ('Login failed (' + res.status + ')'));
          }
        } catch (err) {
          showError('Connection error');
        } finally {
          loginBtn.disabled = false;
          loginText.style.display = 'block';
          spinner.style.display = 'none';
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }

      // Déjà connecté (cookie de session valide) : aller au dashboard.
      fetch('/api/auth/session').then((r) => {
        if (r.ok) window.location.href = '/dashboard';
      }).catch(() => {});
    </script>
  </body>
</html>
