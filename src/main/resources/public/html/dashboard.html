<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModPanel - Dashboard</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="../css/colors.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #4a525d; border: 3px solid var(--bg); border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #5b6572; }

      .topbar {
        height: 52px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.1rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .topbar-left { display: flex; align-items: center; gap: 0.55rem; }
      .topbar-logo {
        width: 24px; height: 24px;
        border-radius: 6px;
        object-fit: cover;
      }
      .topbar-title { color: #ffffff; font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
      .topbar-right { display: flex; align-items: center; gap: 0.7rem; }
      .topbar-user { color: rgba(255, 255, 255, 0.82); font-size: 0.85rem; }
      .btn-logout {
        background: transparent; border: 1px solid rgba(255, 255, 255, 0.45);
        color: #ffffff; padding: 0.3rem 0.7rem;
        border-radius: 4px; cursor: pointer; font: inherit; font-size: 0.8rem; font-weight: 600;
        transition: background 0.12s, border-color 0.12s;
      }
      .btn-logout:hover { background: rgba(255, 255, 255, 0.16); border-color: #ffffff; }

      .layout { display: flex; min-height: calc(100vh - 52px); }
      .sidebar {
        width: 224px;
        flex: 0 0 224px;
        background: #23272d;
        border-right: 1px solid #343a42;
        padding: 0.55rem 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 52px;
        align-self: flex-start;
        height: calc(100vh - 52px);
        overflow-y: auto;
      }
      .sidebar-section {
        padding: 0.35rem 0.75rem 0.3rem;
        color: var(--text-muted);
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }
      .sidebar-section + .sidebar-section,
      .sidebar-item + .sidebar-section {
        margin-top: 0.5rem;
        border-top: 1px solid #343a42;
        padding-top: 0.7rem;
      }
      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.58rem 0.75rem;
        border-left: 3px solid transparent;
        border-radius: 0 4px 4px 0;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
      }
      .sidebar-item:hover { background: #2b3038; color: var(--text); }
      .sidebar-item.active {
        background: rgba(47, 159, 224, 0.13);
        border-left-color: #2f9fe0;
        color: #ffffff;
        font-weight: 600;
      }
      .sidebar-item.active .sidebar-icon { color: #7fc4e8; }
      .sidebar-icon { width: 18px; text-align: center; font-size: 0.95rem; }

      .main-content {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        padding: 1.5rem 1.75rem 3rem;
        overflow-y: auto;
      }
      .page-header {
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: 0;
        margin-bottom: 1.1rem;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .page-header i { font-size: 0.9em; color: var(--text-muted); }
      .topbar-logo i { font-size: 1.05rem; }
      .stat-label i { margin-right: 0.3rem; }
      .section-title i { margin-right: 0.35rem; color: var(--text-muted); font-size: 0.9em; }
      .btn i, .btn-logout i, .back-btn i { font-size: 0.85em; }
      .empty-state i { display: block; font-size: 1.15rem; margin-bottom: 0.35rem; opacity: 0.5; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 0.85rem;
        margin-bottom: 1.4rem;
      }
      .stat-card {
        position: relative;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.95rem 1.05rem 1rem;
        color: #ffffff;
      }
      .stat-card.stat-teal { background: linear-gradient(135deg, #1c8296, #12606f); border-color: #1c8296; }
      .stat-card.stat-green { background: linear-gradient(135deg, #218a49, #16602f); border-color: #218a49; }
      .stat-card.stat-amber { background: linear-gradient(135deg, #bd7c1f, #8c5a12); border-color: #bd7c1f; }
      .stat-card.stat-red { background: linear-gradient(135deg, #b8433e, #8c2f2b); border-color: #b8433e; }
      .stat-card.stat-blue { background: linear-gradient(135deg, #1a6fa8, #14517c); border-color: #1a6fa8; }
      .stat-ghost {
        position: absolute;
        right: 0.7rem;
        bottom: 0.5rem;
        font-size: 2.9rem;
        color: rgba(255, 255, 255, 0.14);
        pointer-events: none;
      }
      .stat-label {
        color: rgba(255, 255, 255, 0.94);
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        margin-bottom: 0.25rem;
      }
      .stat-card[class="stat-card"] .stat-label { color: var(--text-secondary); }
      .stat-value {
        position: relative;
        font-size: 2.05rem;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.15;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .stat-value.warning { color: var(--warn); }
      .stat-value.danger { color: var(--danger); }
      .stat-text {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
        padding-right: 2.2rem;
      }
      .stat-sub {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: rgba(255, 255, 255, 0.86);
        font-size: 0.84rem;
        margin-top: 0.55rem;
      }

      .section-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 1.4rem 0 0.6rem;
        color: var(--text);
      }

      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .table-wrap table { width: 100%; border-collapse: collapse; }
      .table-wrap th {
        text-align: left;
        padding: 0.58rem 0.9rem;
        background: var(--bg-elevated);
        color: var(--text-secondary);
        font-size: 0.73rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      .table-wrap td {
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.87rem;
      }
      .table-wrap tr:last-child td { border-bottom: none; }
      .table-wrap tbody tr:hover { background: #333a44; }
      .table-wrap tr.clickable { cursor: pointer; }
      .table-wrap tr.clickable:hover { background: #36414c; }

      .ping-badge {
        display: inline-block;
        padding: 0.05rem 0.4rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .ping-good { background: rgba(76, 175, 106, 0.18); color: #7fd694; }
      .ping-warn { background: rgba(224, 160, 58, 0.18); color: #f0bf6e; }
      .ping-bad { background: rgba(217, 83, 79, 0.2); color: #f19b98; }

      .btn {
        padding: 0.45rem 0.85rem;
        border: 1px solid transparent;
        border-radius: 4px;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      .btn-primary { background: var(--accent); color: #ffffff; }
      .btn-primary:hover { background: var(--accent-dim); }
      .btn-sm { padding: 0.25rem 0.55rem; font-size: 0.71rem; }

      /* Users */
      .users-grid { display: grid; gap: 0.45rem; }
      .user-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 0.9rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        transition: border-color 0.12s;
      }
      .user-card:hover { border-color: var(--border-light); }
      .user-info { display: flex; flex-direction: column; gap: 0.1rem; }
      .user-name { font-weight: 600; font-size: 0.9rem; }
      .user-meta { color: var(--text-dim); font-size: 0.78rem; }
      .user-badges { display: flex; gap: 0.3rem; flex-wrap: wrap; }
      .badge {
        padding: 0.05rem 0.4rem;
        border-radius: 4px;
        font-size: 0.64rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .badge-admin { background: rgba(217, 83, 79, 0.18); color: #f19b98; }
      .badge-mod { background: rgba(76, 175, 106, 0.16); color: #7fd694; }
      .badge-disabled { background: rgba(174, 182, 194, 0.14); color: var(--text-dim); }

      .refresh-info { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.8rem; text-align: right; }

      /* Modal overlay */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 13, 17, 0.66);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.active { display: flex; }
      .modal-box {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        padding: 1.4rem;
        width: 90%;
        max-width: 460px;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .modal-box h3 { margin: 0 0 0.85rem; color: var(--text); font-size: 0.95rem; font-weight: 600; }
      .modal-actions { display: flex; gap: 0.55rem; justify-content: flex-end; margin-top: 1rem; }

      /* Player detail */
      .player-detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.1rem 1.5rem;
        margin-bottom: 1rem;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.87rem;
      }
      .detail-label { color: var(--text-dim); }
      .detail-value { color: var(--text); font-weight: 500; text-align: right; }

      .inv-grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 3px;
        margin-bottom: 4px;
      }
      .inv-slot {
        aspect-ratio: 1;
        background: #333a44;
        border: 1px solid #454d58;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 40px;
        max-width: 44px;
      }
      .inv-slot img {
        width: 26px;
        height: 26px;
        image-rendering: pixelated;
      }
      .inv-slot .item-count {
        position: absolute;
        bottom: 0;
        right: 2px;
        font-size: 0.62rem;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.85);
      }
      .inv-slot .fa-fallback { font-size: 0.9rem; color: var(--text-muted); }
      .inv-row-label {
        font-size: 0.59rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin: 0.5rem 0 0.25rem;
      }
      .armor-slots {
        display: flex;
        gap: 4px;
        margin-bottom: 0.5rem;
      }
      .armor-slots .inv-slot { width: 40px; height: 40px; }

      .sub-section {
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--text-dim);
        margin: 0.9rem 0 0.4rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .effect-chip {
        display: inline-block;
        padding: 0.1rem 0.45rem;
        background: rgba(58, 166, 216, 0.14);
        border: 1px solid rgba(58, 166, 216, 0.3);
        border-radius: 4px;
        font-size: 0.7rem;
        color: #86cdec;
        margin: 0.15rem 0.2rem 0 0;
      }

      .empty-state {
        color: var(--text-dim);
        font-size: 0.86rem;
        padding: 1.4rem 1rem;
        text-align: center;
        border: 1px dashed var(--border-light);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.02);
      }

      .back-btn {
        background: transparent;
        border: 1px solid var(--border-light);
        color: var(--text-dim);
        padding: 0.3rem 0.65rem;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        transition: border-color 0.12s, color 0.12s;
        margin-bottom: 0.9rem;
      }
      .back-btn:hover { border-color: var(--accent); color: #ffffff; }

      .form-group { margin-bottom: 0.7rem; }
      .form-group label {
        display: block;
        color: var(--text-dim);
        font-size: 0.78rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .form-group input, .form-group select {
        width: 100%;
        padding: 0.45rem 0.65rem;
        background: #23272d;
        border: 1px solid var(--border-light);
        border-radius: 4px;
        color: var(--text);
        font: inherit;
        font-size: 0.86rem;
        box-sizing: border-box;
      }
      .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .coords {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: #7fc4e8;
        font-size: 0.8rem;
      }

      @media (max-width: 860px) {
        .layout { flex-direction: column; }
        .sidebar {
          width: 100%;
          flex: 0 0 auto;
          height: auto;
          position: sticky;
          top: 52px;
          z-index: 90;
          flex-direction: row;
          border-right: 0;
          border-bottom: 1px solid #343a42;
          padding: 0.35rem 0.45rem;
          gap: 0.2rem;
          overflow-x: auto;
        }
        .sidebar-section { display: none; }
        .sidebar-item { white-space: nowrap; padding: 0.4rem 0.6rem; border-left: 0; border-radius: 0; border-bottom: 2px solid transparent; }
        .sidebar-item.active { border-bottom-color: #2f9fe0; border-left: 0; }
        .sidebar-icon { width: auto; }
        .main-content { padding: 1rem 1rem 2.5rem; }
        .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        .player-detail-grid { grid-template-columns: 1fr; }
        .table-wrap { overflow-x: auto; }
        .table-wrap table { min-width: 520px; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-left">
        <img class="topbar-logo" src="/img/modpanel_500px.png" alt="ModPanel" />
        <div class="topbar-title">ModPanel</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-user" id="usernameDisplay"></span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-section">Monitoring</div>
        <div class="sidebar-item active" data-page="dashboard">
          <i class="fas fa-chart-simple sidebar-icon"></i> Dashboard
        </div>
        <div class="sidebar-item" data-page="players">
          <i class="fas fa-users sidebar-icon"></i> Players
        </div>
        <div class="sidebar-section">Administration</div>
        <div class="sidebar-item" data-page="users">
          <i class="fas fa-user-shield sidebar-icon"></i> Users
        </div>
        <div class="sidebar-item" data-page="whitelist">
          <i class="fas fa-shield-halved sidebar-icon"></i> IP Whitelist
        </div>
      </div>

      <div class="main-content" id="mainContent">
        <div id="page-dashboard"></div>
        <div id="page-players" style="display:none;"></div>
        <div id="page-users" style="display:none;"></div>
        <div id="page-whitelist" style="display:none;"></div>
        <div id="page-player-detail" style="display:none;"></div>
      </div>
    </div>

    <div class="modal-overlay" id="createUserModal">
      <div class="modal-box">
        <h3><i class="fas fa-user-plus"></i> Create User</h3>
        <div class="form-group">
          <label>Username</label>
          <input id="newUsername" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="newPassword" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="newRole">
            <option value="moderator">Moderator</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn" style="background:transparent;border:1px solid var(--border);color:var(--text-dim)" onclick="document.getElementById('createUserModal').classList.remove('active')"><i class="fas fa-xmark"></i> Cancel</button>
          <button class="btn btn-primary" onclick="createUser()"><i class="fas fa-check"></i> Create</button>
        </div>
      </div>
    </div>

    <script>
      fetch('/api/auth/session').then(async (r) => {
        if (!r.ok) { window.location.href = '/login'; return; }
        const me = await r.json();
        document.getElementById('usernameDisplay').textContent = me.username || 'Unknown';
      }).catch(() => { window.location.href = '/login'; });

      async function apiFetch(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
        if (res.status === 401) { window.location.href = '/login'; }
        if (!res.ok && res.headers.get('content-type')?.includes('json')) {
          const err = await res.json();
          throw new Error(err.error || 'Request failed');
        }
        if (!res.ok) throw new Error('Request failed');
        return res;
      }

      async function logout() {
        try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
        window.location.href = '/login';
      }

      let currentPage = 'dashboard';

      const ROUTE_PAGES = {
        '/dashboard': 'dashboard',
        '/players': 'players',
        '/users': 'users',
        '/whitelist': 'whitelist'
      };

      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.addEventListener('click', function() {
          navigate('/' + this.dataset.page);
        });
      });

      function navigate(path) {
        if (location.pathname !== path) history.pushState({}, '', path);
        renderRoute();
      }

      async function renderRoute() {
        const detail = location.pathname.match(/^\/players\/([^/]+)$/);
        if (detail) {
          await showPlayerDetailByName(decodeURIComponent(detail[1]));
          return;
        }
        const page = ROUTE_PAGES[location.pathname] || 'dashboard';
        showPage(page);
        await loadPage(page);
      }

      function showPage(page) {
        currentPage = page;
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        document.getElementById('page-' + page).style.display = 'block';
        document.querySelectorAll('.sidebar-item').forEach(x => x.classList.toggle('active', x.dataset.page === page));
      }

      function showPlayerDetailPage(uuid, name) {
        const path = '/players/' + encodeURIComponent(name);
        if (location.pathname !== path) history.pushState({}, '', path);
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        document.getElementById('page-player-detail').style.display = 'block';
        document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
        loadPlayerDetail(uuid, name);
      }

      async function showPlayerDetailByName(name) {
        const container = document.getElementById('page-player-detail');
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        container.style.display = 'block';
        document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
        container.innerHTML = '<div class="page-header"><i class="fas fa-spinner fa-spin"></i>Loading...</div>';

        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          const player = Array.isArray(players)
            ? players.find(p => p.name.toLowerCase() === name.toLowerCase())
            : null;
          if (!player) {
            container.innerHTML = `
              <button class="back-btn" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
              <div class="page-header"><i class="fas fa-triangle-exclamation"></i>Player not found</div>
              <div class="empty-state">No online player named ${escapeHtml(name)}.</div>
            `;
            return;
          }
          loadPlayerDetail(player.uuid, player.name);
        } catch (e) {
          container.innerHTML = `
            <button class="back-btn" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="page-header"><i class="fas fa-triangle-exclamation"></i>Error</div>
            <div class="empty-state">Failed to load player: ${escapeHtml(e.message)}</div>
          `;
        }
      }

      window.addEventListener('popstate', renderRoute);

      async function loadPage(page) {
        switch (page) {
          case 'dashboard': await loadDashboard(); break;
          case 'players': await loadPlayersPage(); break;
          case 'users': await loadUsers(); break;
          case 'whitelist': await loadWhitelist(); break;
        }
      }

      let statsInterval, playersInterval;

      /* ========== DASHBOARD ========== */
      async function loadDashboard() {
        try {
          const res = await apiFetch('/api/stats');
          const d = await res.json();
          if (!d || typeof d.playerCount === 'undefined') {
            document.getElementById('page-dashboard').innerHTML = '<div class="page-header"><i class="fas fa-gauge"></i>Dashboard</div><div class="stat-card" style="color:var(--danger)">Failed to load stats</div>';
            return;
          }
          const tpsColor = d.tps < 15 ? 'danger' : d.tps < 18 ? 'warning' : '';
          const rawVersion = d.mcVersion || '';
          const mcStart = rawVersion.indexOf('(MC:');
          const mcEnd = mcStart < 0 ? -1 : rawVersion.indexOf(')', mcStart + 4);
          const mcVersion = mcEnd > mcStart + 4 ? rawVersion.slice(mcStart + 4, mcEnd).trim() : rawVersion;
          const implVersion = (mcStart < 0 ? rawVersion : rawVersion.slice(0, mcStart)).trim();

          document.getElementById('page-dashboard').innerHTML = `
            <div class="page-header"><i class="fas fa-gauge"></i>Dashboard</div>
            <div class="stats-grid">
              <div class="stat-card stat-teal">
                <i class="fas fa-user-group stat-ghost"></i>
                <div class="stat-label"><i class="fas fa-user-group"></i>Players Online</div>
                <div class="stat-value">${d.playerCount}<span style="font-size:1.1rem;color:rgba(255,255,255,0.7)">/${d.maxPlayers}</span></div>
                <div class="stat-sub">${d.serverName || 'Minecraft Server'}</div>
              </div>
              <div class="stat-card ${tpsColor === 'danger' ? 'stat-red' : tpsColor === 'warning' ? 'stat-amber' : 'stat-green'}">
                <i class="fas fa-gauge-high stat-ghost"></i>
                <div class="stat-label"><i class="fas fa-gauge-high"></i>TPS</div>
                <div class="stat-value">${d.tps.toFixed(1)}</div>
                <div class="stat-sub">Target: 20.0</div>
              </div>
              <div class="stat-card stat-blue">
                <i class="fas fa-server stat-ghost"></i>
                <div class="stat-label"><i class="fas fa-server"></i>Server</div>
                <div class="stat-value stat-text" title="${escapeHtml(implVersion)}">${escapeHtml((d.serverName || 'Server') + ': ' + (mcVersion || 'N/A'))}</div>
                <div class="stat-sub">Version</div>
              </div>
            </div>
            <div class="section-title"><i class="fas fa-users"></i>Online Players</div>
            <div id="dashboard-players-list"></div>
            <div class="refresh-info" id="refreshInfo"></div>
          `;
          await loadPlayersList();
          if (statsInterval) clearInterval(statsInterval);
          statsInterval = setInterval(async () => {
            try {
              const r = await apiFetch('/api/stats');
              const s = await r.json();
              if (s && s.playerCount !== undefined) {
                const cards = document.querySelectorAll('.stat-value');
                if (cards[0]) cards[0].innerHTML = s.playerCount + '<span style="font-size:1.1rem;color:rgba(255,255,255,0.7)">/' + s.maxPlayers + '</span>';
                if (cards[1]) cards[1].textContent = s.tps.toFixed(1);
              }
            } catch(e) {}
          }, 5000);
        } catch (e) {
          document.getElementById('page-dashboard').innerHTML = '<div class="page-header"><i class="fas fa-gauge"></i>Dashboard</div><div class="stat-card" style="color:var(--danger)">Failed to load: ' + e.message + '</div>';
        }
      }

      async function loadPlayersList() {
        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          if (!Array.isArray(players)) throw new Error('Invalid response');
          const list = document.getElementById('dashboard-players-list');
          if (!list) return;
          if (players.length === 0) {
            list.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i>No players online</div>';
            document.getElementById('refreshInfo').textContent = '';
            return;
          }
          list.innerHTML = `<div class="table-wrap"><table><thead><tr>
            <th>Player</th><th>World</th><th>Health</th><th>Ping</th>
          </tr></thead><tbody>
            ${players.map(p => `<tr class="clickable" onclick="showPlayerDetailPage('${p.uuid}','${escapeHtml(p.name)}')">
              <td><span style="color:var(--accent);font-weight:600">${escapeHtml(p.displayName)}</span></td>
              <td style="color:var(--text-dim)">${p.world}</td>
              <td>${p.health}/${p.maxHealth}</td>
              <td><span class="ping-badge ${p.ping > 150 ? 'ping-bad' : p.ping > 80 ? 'ping-warn' : 'ping-good'}">${p.ping}ms</span></td>
            </tr>`).join('')}
          </tbody></table></div>`;
          document.getElementById('refreshInfo').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        } catch (e) {
          const list = document.getElementById('dashboard-players-list');
          if (list) list.innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>Error loading players</div>';
        }
      }

      /* ========== PLAYERS PAGE ========== */
      async function loadPlayersPage() {
        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          if (!Array.isArray(players)) throw new Error('Invalid response');

          let html = '<div class="page-header"><i class="fas fa-users"></i>Players</div>';
          if (players.length === 0) {
            html += '<div class="empty-state"><i class="fas fa-user-slash"></i>No players online</div>';
          } else {
            html += `<div class="table-wrap"><table><thead><tr>
              <th>Player</th><th>World</th><th>Health</th><th>Ping</th><th>IP</th><th>Coords</th><th>Game Mode</th>
            </tr></thead><tbody>
              ${players.map(p => `<tr class="clickable" onclick="showPlayerDetailPage('${p.uuid}','${escapeHtml(p.name)}')">
                <td><span style="color:var(--accent);font-weight:600">${escapeHtml(p.displayName)}</span></td>
                <td style="color:var(--text-dim)">${p.world}</td>
                <td>${p.health}/${p.maxHealth}</td>
                <td><span class="ping-badge ${p.ping > 150 ? 'ping-bad' : p.ping > 80 ? 'ping-warn' : 'ping-good'}">${p.ping}ms</span></td>
                <td style="color:var(--text-dim);font-size:0.75rem;font-family:monospace">${p.ip}</td>
                <td class="coords">${p.x}, ${p.y}, ${p.z}</td>
                <td style="color:var(--text-dim)">${p.gamemode}</td>
              </tr>`).join('')}
            </tbody></table></div>`;
          }
          document.getElementById('page-players').innerHTML = html;
        } catch (e) {
          document.getElementById('page-players').innerHTML = '<div class="page-header">Players</div><div class="empty-state">Error loading players</div>';
        }
      }

      /* ========== PLAYER DETAIL ========== */
      let currentDetailUuid = null;

      async function loadPlayerDetail(uuid, name) {
        currentDetailUuid = uuid;
        const container = document.getElementById('page-player-detail');
        container.innerHTML = '<div class="page-header"><i class="fas fa-spinner fa-spin"></i>Loading...</div>';

        try {
          const res = await apiFetch('/api/players/detail?uuid=' + uuid);
          const p = await res.json();
          if (!p || !p.name) throw new Error('Invalid response');

          const pingClass = p.ping > 150 ? 'ping-bad' : p.ping > 80 ? 'ping-warn' : 'ping-good';

          function itemSlotImg(type, count) {
            const imgName = type.toLowerCase() + '.png';
            const displayName = type.replace(/_/g, ' ').toLowerCase();
            const countHtml = count > 1 ? '<span class="item-count">' + count + '</span>' : '';
            return `<div class="inv-slot"><img src="/items/${imgName}" alt="${displayName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><i class="fas fa-cube fa-fallback" style="display:none"></i>${countHtml}</div>`;
          }

          function emptySlot() {
            return '<div class="inv-slot"></div>';
          }

          // Find item at a given slot index
          function itemAt(slotIdx) {
            return p.inventory ? p.inventory.find(s => s.slot === slotIdx) : null;
          }

          // Main inventory: slots 9-35 (3 rows of 9)
          let invHtml = '<div class="sub-section">Inventory</div>';
          for (let row = 0; row < 3; row++) {
            invHtml += '<div class="inv-grid">';
            for (let col = 0; col < 9; col++) {
              const idx = 9 + row * 9 + col;
              const item = itemAt(idx);
              invHtml += item ? itemSlotImg(item.type, item.amount) : emptySlot();
            }
            invHtml += '</div>';
          }
          // Hotbar: slots 0-8 (1 row of 9)
          invHtml += '<div class="inv-row-label">Hotbar</div><div class="inv-grid">';
          for (let i = 0; i < 9; i++) {
            const item = itemAt(i);
            invHtml += item ? itemSlotImg(item.type, item.amount) : emptySlot();
          }
          invHtml += '</div>';

          function armorSlotImg(type) {
            const imgName = type.toLowerCase() + '.png';
            const displayName = type.replace(/_/g, ' ').toLowerCase();
            return `<div class="inv-slot"><img src="/items/${imgName}" alt="${displayName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><i class="fas fa-cube fa-fallback" style="display:none"></i></div>`;
          }

          let armorHtml = '';
          if (p.armor && p.armor.length > 0) {
            armorHtml += '<div class="sub-section">Armor</div><div class="armor-slots">';
            p.armor.forEach(a => {
              armorHtml += armorSlotImg(a.type);
            });
            armorHtml += '</div>';
          }

          let offhandHtml = '';
          if (p.offhand) {
            offhandHtml += '<div class="sub-section">Offhand</div><div class="armor-slots">';
            offhandHtml += armorSlotImg(p.offhand);
            offhandHtml += '</div>';
          }

          let effectsHtml = '';
          if (p.potionEffects && p.potionEffects.length > 0) {
            effectsHtml += '<div class="sub-section">Effects</div>';
            p.potionEffects.forEach(e => {
              effectsHtml += `<span class="effect-chip">${e.type} ${e.amplifier + 1} (${e.duration}s)</span>`;
            });
          }

          container.innerHTML = `
            <button class="back-btn" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="page-header"><i class="fas fa-user"></i>${escapeHtml(p.displayName)}</div>
            <div class="stats-grid" style="grid-template-columns:1fr 1fr">
              <div class="stat-card">
                <div class="player-detail-grid">
                  <div class="detail-row"><span class="detail-label">UUID</span><span class="detail-value" style="font-size:0.7rem;font-family:monospace">${p.uuid}</span></div>
                  <div class="detail-row"><span class="detail-label">IP</span><span class="detail-value" style="font-family:monospace">${p.ip}</span></div>
                  <div class="detail-row"><span class="detail-label">World</span><span class="detail-value">${p.world}</span></div>
                  <div class="detail-row"><span class="detail-label">Coords</span><span class="detail-value coords">${Math.round(p.x)}, ${Math.round(p.y)}, ${Math.round(p.z)}</span></div>
                  <div class="detail-row"><span class="detail-label">Health</span><span class="detail-value">${p.health} / ${p.maxHealth}</span></div>
                  <div class="detail-row"><span class="detail-label">Food</span><span class="detail-value">${p.food} / 20</span></div>
                  <div class="detail-row"><span class="detail-label">Ping</span><span class="detail-value"><span class="ping-badge ${pingClass}">${p.ping}ms</span></span></div>
                  <div class="detail-row"><span class="detail-label">Game Mode</span><span class="detail-value">${p.gamemode}</span></div>
                  <div class="detail-row"><span class="detail-label">Level</span><span class="detail-value">${p.level}</span></div>
                  <div class="detail-row"><span class="detail-label">Locale</span><span class="detail-value">${p.locale}</span></div>
                </div>
              </div>
              <div class="stat-card">
                ${armorHtml}
                ${offhandHtml}
                ${effectsHtml || '<div style="color:var(--text-dim);font-size:0.8rem;margin-top:0.5rem">No active effects</div>'}
              </div>
            </div>
            ${invHtml}
          `;
        } catch (e) {
          container.innerHTML = `
            <button class="back-btn" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="page-header"><i class="fas fa-triangle-exclamation"></i>Error</div>
            <div class="empty-state">Failed to load player detail: ${e.message}</div>
          `;
        }
      }

      function backToPlayers() {
        navigate('/players');
      }

      /* ========== USERS ========== */
      async function loadUsers() {
        try {
          const res = await apiFetch('/api/users');
          const users = await res.json();
          if (!Array.isArray(users)) throw new Error('Invalid users data');

          document.getElementById('page-users').innerHTML = `
            <div class="page-header" style="justify-content:space-between">
              <span><i class="fas fa-user-shield"></i> Users</span>
              <button class="btn btn-primary btn-sm" onclick="document.getElementById('createUserModal').classList.add('active')"><i class="fas fa-plus"></i> Add User</button>
            </div>
            <div class="users-grid">
              ${users.map(u => `<div class="user-card">
                <div class="user-info">
                  <div class="user-name">${escapeHtml(u.username)}</div>
                  <div class="user-meta">Role: ${u.role} | Created: ${u.createdAt ? u.createdAt.split('T')[0] : 'N/A'} | Last login: ${u.lastLogin ? u.lastLogin.split('T')[0] : 'Never'}</div>
                </div>
                <div class="user-badges">
                  ${u.role === 'admin' || u.role === 'owner' ? '<span class="badge badge-admin">admin</span>' : '<span class="badge badge-mod">mod</span>'}
                  ${!u.enabled ? '<span class="badge badge-disabled">disabled</span>' : ''}
                </div>
              </div>`).join('')}
            </div>
          `;
        } catch (e) {
          document.getElementById('page-users').innerHTML = '<div class="page-header"><i class="fas fa-user-shield"></i>Users</div><div class="empty-state"><i class="fas fa-triangle-exclamation"></i>Error loading users</div>';
        }
      }

      async function createUser() {
        const username = document.getElementById('newUsername').value;
        const password = document.getElementById('newPassword').value;
        const role = document.getElementById('newRole').value;
        if (!username || !password) return alert('Fill all fields');
        const res = await apiFetch('/api/users/create', {
          method: 'POST',
          body: JSON.stringify({ username, password, role })
        });
        if (res.ok) {
          document.getElementById('createUserModal').classList.remove('active');
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          loadUsers();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to create user');
        }
      }

      /* ========== WHITELIST ========== */
      async function loadWhitelist() {
        try {
          const res = await apiFetch('/api/whitelist');
          let entries = await res.json();
          if (!Array.isArray(entries)) entries = [];

          document.getElementById('page-whitelist').innerHTML = `
            <div class="page-header"><i class="fas fa-shield-halved"></i>IP Whitelist</div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>IP Address</th><th>Added At</th></tr></thead>
                <tbody>
                  ${entries.length === 0 ? '<tr><td colspan="2" style="color:var(--text-dim);text-align:center;padding:1rem"><i class="fas fa-shield-halved"></i> No entries</td></tr>' :
                    entries.map(e => `<tr><td style="font-family:monospace">${e.ip}</td><td style="color:var(--text-dim)">${e.addedAt || 'N/A'}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;
        } catch (e) {
          document.getElementById('page-whitelist').innerHTML = '<div class="page-header"><i class="fas fa-shield-halved"></i>IP Whitelist</div><div class="empty-state"><i class="fas fa-triangle-exclamation"></i>Error loading whitelist</div>';
        }
      }

      /* ========== UTILITY ========== */
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      window.onload = () => renderRoute();
      window.onbeforeunload = () => { if (statsInterval) clearInterval(statsInterval); if (playersInterval) clearInterval(playersInterval); };
    </script>
  </body>
</html>
