<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModPanel - Dashboard</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous" referrerpolicy="no-referrer" />
      </head>
  <body class="min-h-screen">
    <div class="sticky top-0 z-50 flex h-[52px] items-center justify-between bg-accent px-4">
      <div class="flex items-center gap-2.5">
        <img class="size-6 rounded-md object-cover" src="/img/modpanel_500px.png" alt="ModPanel" />
        <div class="text-[15px] font-semibold text-white">ModPanel</div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-[13px] text-white/80" id="usernameDisplay"></span>
        <button class="inline-flex items-center gap-2 rounded border border-white/45 px-2.5 py-1 text-[12px] font-semibold text-white transition hover:border-white hover:bg-white/15" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="flex min-h-[calc(100vh-52px)] max-[860px]:flex-col">
      <nav class="sticky top-[52px] flex h-[calc(100vh-52px)] w-56 shrink-0 flex-col gap-0.5 overflow-y-auto border-r border-[#343a42] bg-[#23272d] p-2 max-[860px]:h-auto max-[860px]:w-full max-[860px]:flex-row max-[860px]:overflow-x-auto max-[860px]:border-b max-[860px]:border-r-0 max-[860px]:py-1.5">
        <div class="px-3 pb-1.5 pt-2 text-[10.5px] font-semibold uppercase tracking-[0.09em] text-muted max-[860px]:hidden">Monitoring</div>
        <div class="sidebar-item flex cursor-pointer items-center gap-3 border-l-[3px] px-3 py-[9px] text-[13.5px] text-dim transition hover:bg-panel hover:text-ink max-[860px]:whitespace-nowrap max-[860px]:border-b-2 max-[860px]:border-l-0 max-[860px]:px-2.5 max-[860px]:py-1.5 border-l-[#2f9fe0] bg-panel font-semibold text-white max-[860px]:border-b-[#2f9fe0]" data-page="dashboard">
          <i class="fas fa-chart-simple w-[18px] text-center text-[#7fc4e8]"></i> Dashboard
        </div>
        <div class="sidebar-item flex cursor-pointer items-center gap-3 border-l-[3px] border-transparent px-3 py-[9px] text-[13.5px] text-dim transition hover:bg-panel hover:text-ink max-[860px]:whitespace-nowrap max-[860px]:border-b-2 max-[860px]:border-l-0 max-[860px]:px-2.5 max-[860px]:py-1.5" data-page="players">
          <i class="fas fa-users w-[18px] text-center"></i> Players
        </div>
        <div class="px-3 pb-1.5 pt-2 text-[10.5px] font-semibold uppercase tracking-[0.09em] text-muted max-[860px]:hidden">Administration</div>
        <div class="sidebar-item flex cursor-pointer items-center gap-3 border-l-[3px] border-transparent px-3 py-[9px] text-[13.5px] text-dim transition hover:bg-panel hover:text-ink max-[860px]:whitespace-nowrap max-[860px]:border-b-2 max-[860px]:border-l-0 max-[860px]:px-2.5 max-[860px]:py-1.5" data-page="users">
          <i class="fas fa-user-shield w-[18px] text-center"></i> Users
        </div>
        <div class="sidebar-item flex cursor-pointer items-center gap-3 border-l-[3px] border-transparent px-3 py-[9px] text-[13.5px] text-dim transition hover:bg-panel hover:text-ink max-[860px]:whitespace-nowrap max-[860px]:border-b-2 max-[860px]:border-l-0 max-[860px]:px-2.5 max-[860px]:py-1.5" data-page="whitelist">
          <i class="fas fa-shield-halved w-[18px] text-center"></i> IP Whitelist
        </div>
      </nav>

      <div class="min-w-0 flex-1 px-7 pb-12 pt-6 max-[860px]:px-4 max-[860px]:py-4" id="mainContent">
        <div id="page-dashboard"></div>
        <div id="page-players" style="display:none;"></div>
        <div id="page-users" style="display:none;"></div>
        <div id="page-whitelist" style="display:none;"></div>
        <div id="page-player-detail" style="display:none;"></div>
      </div>
    </div>

    <div class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60" id="createUserModal">
      <div class="max-h-[85vh] w-[90%] max-w-[460px] overflow-y-auto rounded-md border border-[#4a525d] bg-panel p-6 shadow-2xl">
        <h3 class="mb-3.5 text-[15px] font-semibold"><i class="fas fa-user-plus"></i> Create User</h3>
        <div class="mb-3">
          <label class="mb-1 block text-[12px] font-semibold text-dim">Username</label>
          <input id="newUsername" class="w-full rounded border border-[#4a525d] bg-[#23272d] px-2.5 py-1.5 text-[13px] text-ink outline-none focus:border-accent focus:ring-[3px] focus:ring-accent/20" />
        </div>
        <div class="mb-3">
          <label class="mb-1 block text-[12px] font-semibold text-dim">Password</label>
          <input type="password" id="newPassword" class="w-full rounded border border-[#4a525d] bg-[#23272d] px-2.5 py-1.5 text-[13px] text-ink outline-none focus:border-accent focus:ring-[3px] focus:ring-accent/20" />
        </div>
        <div class="mb-3">
          <label class="mb-1 block text-[12px] font-semibold text-dim">Role</label>
          <select id="newRole" class="w-full rounded border border-[#4a525d] bg-[#23272d] px-2.5 py-1.5 text-[13px] text-ink outline-none focus:border-accent focus:ring-[3px] focus:ring-accent/20">
            <option value="moderator">Moderator</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="mt-4 flex justify-end gap-2">
          <button class="inline-flex items-center gap-2 rounded border border-line px-3.5 py-1.5 text-[12.5px] font-semibold text-dim transition hover:text-ink" onclick="closeCreateUser()"><i class="fas fa-xmark"></i> Cancel</button>
          <button class="inline-flex items-center gap-2 rounded bg-accent px-3.5 py-1.5 text-[12.5px] font-semibold text-white transition hover:bg-accent-dark" onclick="createUser()"><i class="fas fa-check"></i> Create</button>
        </div>
      </div>
    </div>

    <script>
      fetch('/api/auth/session').then(async (r) => {
        if (!r.ok) { window.location.href = '/login'; return; }
        const me = await r.json();
        document.getElementById('usernameDisplay').textContent = me.username || 'Unknown';
      }).catch(() => { window.location.href = '/login'; });

      async function apiFetch(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
        if (res.status === 401) { window.location.href = '/login'; }
        if (!res.ok && res.headers.get('content-type')?.includes('json')) {
          const err = await res.json();
          throw new Error(err.error || 'Request failed');
        }
        if (!res.ok) throw new Error('Request failed');
        return res;
      }

      async function logout() {
        try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
        window.location.href = '/login';
      }

      const NAV_BASE = 'sidebar-item flex cursor-pointer items-center gap-3 border-l-[3px] px-3 py-[9px] text-[13.5px] text-dim transition hover:bg-panel hover:text-ink max-[860px]:whitespace-nowrap max-[860px]:border-b-2 max-[860px]:border-l-0 max-[860px]:px-2.5 max-[860px]:py-1.5';
      const NAV_IDLE = 'border-l-transparent';
      const NAV_ACTIVE = 'border-l-[#2f9fe0] bg-panel font-semibold text-white max-[860px]:border-b-[#2f9fe0]';

      const ui = {
        page: 'mb-5 flex items-center gap-2 text-[19px] font-semibold',
        sectionTitle: 'mb-2.5 mt-6 flex items-center gap-2 text-[15px] font-semibold',
        statsGrid: 'mb-6 grid grid-cols-[repeat(auto-fit,minmax(210px,1fr))] gap-3.5 max-[860px]:grid-cols-[repeat(auto-fit,minmax(150px,1fr))]',
        statCard: 'relative min-h-[96px] overflow-hidden rounded-md px-4 py-3.5 text-white',
        statLabel: 'mb-1 flex items-center gap-1.5 text-[13px] text-white/90',
        statValue: 'stat-value text-[27px] font-bold leading-tight tracking-tight tabular-nums',
        statText: 'stat-value pr-9 text-[17px] font-semibold leading-snug [overflow-wrap:anywhere]',
        statSub: 'mt-2 flex items-center gap-1.5 text-[12.5px] text-white/85',
        ghost: 'pointer-events-none absolute bottom-2 right-2.5 text-[46px] text-white/15',
        teal: 'bg-[linear-gradient(135deg,#1c8296,#12606f)]',
        green: 'bg-[linear-gradient(135deg,#218a49,#16602f)]',
        amber: 'bg-[linear-gradient(135deg,#bd7c1f,#8c5a12)]',
        red: 'bg-[linear-gradient(135deg,#b8433e,#8c2f2b)]',
        blue: 'bg-[linear-gradient(135deg,#1a6fa8,#14517c)]',
        tableWrap: 'overflow-hidden rounded-md border border-line bg-panel max-[860px]:overflow-x-auto',
        table: 'w-full border-collapse max-[860px]:min-w-[520px]',
        th: 'border-b border-line bg-raised px-3.5 py-2 text-left text-[10.5px] font-semibold uppercase tracking-wider text-dim',
        td: 'border-b border-line px-3.5 py-2 text-[13px]',
        row: 'hover:bg-raised/60',
        rowLink: 'cursor-pointer hover:bg-[#36414c]',
        ping: 'inline-block rounded px-1.5 py-0.5 text-[11.5px] font-semibold tabular-nums',
        pingGood: 'bg-emerald-500/15 text-emerald-300',
        pingWarn: 'bg-amber-500/15 text-amber-300',
        pingBad: 'bg-red-500/15 text-red-300',
        empty: 'rounded-md border border-dashed border-[#4a525d] bg-white/[0.02] p-6 text-center text-[13px] text-dim',
        btn: 'inline-flex items-center gap-2 rounded px-3.5 py-1.5 text-[12.5px] font-semibold transition',
        btnPrimary: 'bg-accent text-white hover:bg-accent-dark',
        back: 'mb-3 inline-flex items-center gap-2 rounded border border-[#4a525d] px-2.5 py-1 text-[12px] font-semibold text-dim transition hover:border-accent hover:text-white',
        refresh: 'mt-3 text-right text-[11.5px] text-muted',
        userCard: 'flex items-center justify-between gap-4 rounded-md border border-line bg-panel px-3.5 py-3 hover:border-[#4a525d]',
        badge: 'rounded px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider',
        badgeAdmin: 'bg-red-500/15 text-red-300',
        badgeMod: 'bg-emerald-500/15 text-emerald-300',
        badgeOff: 'bg-white/10 text-dim',
        card: 'rounded-md border border-line bg-panel',
        detailGrid: 'grid grid-cols-2 gap-x-6 max-[860px]:grid-cols-1',
        detailRow: 'flex justify-between gap-4 border-b border-line py-1.5 text-[13px]',
        detailLabel: 'text-dim',
        detailValue: 'text-right font-medium',
        subSection: 'mb-1.5 mt-3.5 text-[11px] font-semibold uppercase tracking-wider text-dim',
        invGrid: 'mb-1 grid grid-cols-9 gap-[3px]',
        invSlot: 'relative flex aspect-square min-h-[40px] max-w-[44px] items-center justify-center rounded-[3px] border border-[#454d58] bg-raised',
        invImg: 'size-[26px] [image-rendering:pixelated]',
        itemCount: 'absolute bottom-0 right-0.5 text-[10px] font-bold text-white [text-shadow:1px_1px_1px_rgba(0,0,0,.85)]',
        invLabel: 'mb-1 mt-2 text-[9.5px] uppercase tracking-wider text-muted',
        effect: 'mr-1 mt-1 inline-block rounded border border-sky-400/30 bg-sky-400/15 px-1.5 py-0.5 text-[10.5px] text-sky-300',
        muted: 'text-[12px] text-dim'
      };

      function setActiveNav(page) {
        document.querySelectorAll('.sidebar-item').forEach(el => {
          const on = el.dataset.page === page;
          el.className = NAV_BASE + ' ' + (on ? NAV_ACTIVE : NAV_IDLE);
          const icon = el.querySelector('i');
          if (icon) icon.classList.toggle('text-[#7fc4e8]', on);
        });
      }

      let currentPage = 'dashboard';

      const ROUTE_PAGES = {
        '/dashboard': 'dashboard',
        '/players': 'players',
        '/users': 'users',
        '/whitelist': 'whitelist'
      };

      const PAGE_TITLES = {
        dashboard: 'Dashboard',
        players: 'Players',
        users: 'Users',
        whitelist: 'IP Whitelist'
      };

      function setTitle(page, detail) {
        const label = PAGE_TITLES[page] || 'Dashboard';
        document.title = detail ? `ModPanel - ${detail} | ${label}` : `ModPanel - ${label}`;
      }

      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.addEventListener('click', function() {
          navigate('/' + this.dataset.page);
        });
      });

      function navigate(path) {
        if (location.pathname !== path) history.pushState({}, '', path);
        renderRoute();
      }

      async function renderRoute() {
        const detail = location.pathname.match(/^\/players\/([^/]+)$/);
        if (detail) {
          await showPlayerDetailByName(decodeURIComponent(detail[1]));
          return;
        }
        const page = ROUTE_PAGES[location.pathname] || 'dashboard';
        showPage(page);
        await loadPage(page);
      }

      function showPage(page) {
        currentPage = page;
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        document.getElementById('page-' + page).style.display = 'block';
        setActiveNav(page);
        setTitle(page);
      }

      function showPlayerDetailPage(uuid, name) {
        const path = '/players/' + encodeURIComponent(name);
        if (location.pathname !== path) history.pushState({}, '', path);
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        document.getElementById('page-player-detail').style.display = 'block';
        setActiveNav(null);
        setTitle('players', name);
        loadPlayerDetail(uuid, name);
      }

      async function showPlayerDetailByName(name) {
        const container = document.getElementById('page-player-detail');
        document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
        container.style.display = 'block';
        setActiveNav(null);
        setTitle('players', name);
        container.innerHTML = `<div class="${ui.page}"><i class="fas fa-spinner fa-spin"></i>Loading...</div>`;

        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          const player = Array.isArray(players)
            ? players.find(p => p.name.toLowerCase() === name.toLowerCase())
            : null;
          if (!player) {
            container.innerHTML = `
              <button class="${ui.back}" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
              <div class="${ui.page}"><i class="fas fa-triangle-exclamation"></i>Player not found</div>
              <div class="${ui.empty}">No online player named ${escapeHtml(name)}.</div>
            `;
            return;
          }
          loadPlayerDetail(player.uuid, player.name);
        } catch (e) {
          container.innerHTML = `
            <button class="${ui.back}" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="${ui.page}"><i class="fas fa-triangle-exclamation"></i>Error</div>
            <div class="${ui.empty}">Failed to load player: ${escapeHtml(e.message)}</div>
          `;
        }
      }

      window.addEventListener('popstate', renderRoute);

      async function loadPage(page) {
        switch (page) {
          case 'dashboard': await loadDashboard(); break;
          case 'players': await loadPlayersPage(); break;
          case 'users': await loadUsers(); break;
          case 'whitelist': await loadWhitelist(); break;
        }
      }

      let statsInterval, playersInterval;

      /* ========== DASHBOARD ========== */
      async function loadDashboard() {
        try {
          const res = await apiFetch('/api/stats');
          const d = await res.json();
          if (!d || typeof d.playerCount === 'undefined') {
            document.getElementById('page-dashboard').innerHTML = `<div class="${ui.page}"><i class="fas fa-gauge"></i>Dashboard</div><div class="${ui.card} p-4 text-red-300">Failed to load stats</div>`;
            return;
          }
          const tpsColor = d.tps < 15 ? 'danger' : d.tps < 18 ? 'warning' : '';
          const rawVersion = d.mcVersion || '';
          const mcStart = rawVersion.indexOf('(MC:');
          const mcEnd = mcStart < 0 ? -1 : rawVersion.indexOf(')', mcStart + 4);
          const mcVersion = mcEnd > mcStart + 4 ? rawVersion.slice(mcStart + 4, mcEnd).trim() : rawVersion;
          const implVersion = (mcStart < 0 ? rawVersion : rawVersion.slice(0, mcStart)).trim();

          document.getElementById('page-dashboard').innerHTML = `
            <div class="${ui.page}"><i class="fas fa-gauge"></i>Dashboard</div>
            <div class="${ui.statsGrid}">
              <div class="${ui.statCard} ${ui.teal}">
                <i class="fas fa-user-group ${ui.ghost}"></i>
                <div class="${ui.statLabel}"><i class="fas fa-user-group"></i>Players Online</div>
                <div class="${ui.statValue}">${d.playerCount}<span class="text-[16px] font-medium text-white/70">/${d.maxPlayers}</span></div>
                <div class="${ui.statSub}">${d.serverName || 'Minecraft Server'}</div>
              </div>
              <div class="${ui.statCard} ${tpsColor === 'danger' ? ui.red : tpsColor === 'warning' ? ui.amber : ui.green}">
                <i class="fas fa-gauge-high ${ui.ghost}"></i>
                <div class="${ui.statLabel}"><i class="fas fa-gauge-high"></i>TPS</div>
                <div class="${ui.statValue}">${d.tps.toFixed(1)}</div>
                <div class="${ui.statSub}">Target: 20.0</div>
              </div>
              <div class="${ui.statCard} ${ui.blue}">
                <i class="fas fa-server ${ui.ghost}"></i>
                <div class="${ui.statLabel}"><i class="fas fa-server"></i>Server</div>
                <div class="${ui.statText}" title="${escapeHtml(implVersion)}">${escapeHtml((d.serverName || 'Server') + ': ' + (mcVersion || 'N/A'))}</div>
                <div class="${ui.statSub}">Version</div>
              </div>
            </div>
            <div class="${ui.sectionTitle}"><i class="fas fa-users"></i>Online Players</div>
            <div id="dashboard-players-list"></div>
            <div class="${ui.refresh}" id="refreshInfo"></div>
          `;
          await loadPlayersList();
          if (statsInterval) clearInterval(statsInterval);
          statsInterval = setInterval(async () => {
            try {
              const r = await apiFetch('/api/stats');
              const s = await r.json();
              if (s && s.playerCount !== undefined) {
                const cards = document.querySelectorAll('.stat-value');
                if (cards[0]) cards[0].innerHTML = s.playerCount + '<span class="text-[16px] font-medium text-white/70">/' + s.maxPlayers + '</span>';
                if (cards[1]) cards[1].textContent = s.tps.toFixed(1);
              }
            } catch(e) {}
          }, 5000);
        } catch (e) {
          document.getElementById('page-dashboard').innerHTML = `<div class="${ui.page}"><i class="fas fa-gauge"></i>Dashboard</div><div class="${ui.card} p-4 text-red-300">Failed to load: ${e.message}</div>`;
        }
      }

      async function loadPlayersList() {
        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          if (!Array.isArray(players)) throw new Error('Invalid response');
          const list = document.getElementById('dashboard-players-list');
          if (!list) return;
          if (players.length === 0) {
            list.innerHTML = `<div class="${ui.empty}"><i class="mb-1.5 block text-[18px] opacity-50"></i>No players online</div>`;
            document.getElementById('refreshInfo').textContent = '';
            return;
          }
          list.innerHTML = `<div class="${ui.tableWrap}"><table class="${ui.table}"><thead><tr>
            <th class="${ui.th}">Player</th><th class="${ui.th}">World</th><th class="${ui.th}">Health</th><th class="${ui.th}">Ping</th>
          </tr></thead><tbody>
            ${players.map(p => `<tr class="${ui.rowLink}" onclick="showPlayerDetailPage('${p.uuid}','${escapeHtml(p.name)}')">
              <td class="${ui.td}"><span class="font-semibold text-[#7fc4e8]">${escapeHtml(p.displayName)}</span></td>
              <td class="${ui.td} text-dim">${p.world}</td>
              <td class="${ui.td}">${p.health}/${p.maxHealth}</td>
              <td class="${ui.td}"><span class="${ui.ping} ${p.ping > 150 ? ui.pingBad : p.ping > 80 ? ui.pingWarn : ui.pingGood}">${p.ping}ms</span></td>
            </tr>`).join('')}
          </tbody></table></div>`;
          document.getElementById('refreshInfo').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        } catch (e) {
          const list = document.getElementById('dashboard-players-list');
          if (list) list.innerHTML = `<div class="${ui.empty}">Error loading players</div>`;
        }
      }

      /* ========== PLAYERS PAGE ========== */
      async function loadPlayersPage() {
        try {
          const res = await apiFetch('/api/players');
          const players = await res.json();
          if (!Array.isArray(players)) throw new Error('Invalid response');

          let html = `<div class="${ui.page}"><i class="fas fa-users"></i>Players</div>`;
          if (players.length === 0) {
            html += `<div class="${ui.empty}">No players online</div>`;
          } else {
            html += `<div class="${ui.tableWrap}"><table class="${ui.table}"><thead><tr>
              <th class="${ui.th}">Player</th><th class="${ui.th}">World</th><th class="${ui.th}">Health</th><th class="${ui.th}">Ping</th><th class="${ui.th}">IP</th><th class="${ui.th}">Coords</th><th class="${ui.th}">Game Mode</th>
            </tr></thead><tbody>
              ${players.map(p => `<tr class="${ui.rowLink}" onclick="showPlayerDetailPage('${p.uuid}','${escapeHtml(p.name)}')">
                <td class="${ui.td}"><span class="font-semibold text-[#7fc4e8]">${escapeHtml(p.displayName)}</span></td>
                <td class="${ui.td} text-dim">${p.world}</td>
                <td class="${ui.td}">${p.health}/${p.maxHealth}</td>
                <td class="${ui.td}"><span class="${ui.ping} ${p.ping > 150 ? ui.pingBad : p.ping > 80 ? ui.pingWarn : ui.pingGood}">${p.ping}ms</span></td>
                <td class="${ui.td} font-mono text-[11.5px] text-dim">${p.ip}</td>
                <td class="${ui.td} font-mono text-[12px] text-[#7fc4e8]">${p.x}, ${p.y}, ${p.z}</td>
                <td class="${ui.td} text-dim">${p.gamemode}</td>
              </tr>`).join('')}
            </tbody></table></div>`;
          }
          document.getElementById('page-players').innerHTML = html;
        } catch (e) {
          document.getElementById('page-players').innerHTML = `<div class="${ui.page}"><i class="fas fa-users"></i>Players</div><div class="${ui.empty}">Error loading players</div>`;
        }
      }

      /* ========== PLAYER DETAIL ========== */
      let currentDetailUuid = null;

      async function loadPlayerDetail(uuid, name) {
        currentDetailUuid = uuid;
        const container = document.getElementById('page-player-detail');
        container.innerHTML = `<div class="${ui.page}"><i class="fas fa-spinner fa-spin"></i>Loading...</div>`;

        try {
          const res = await apiFetch('/api/players/detail?uuid=' + uuid);
          const p = await res.json();
          if (!p || !p.name) throw new Error('Invalid response');
          setTitle('players', p.displayName || p.name);

          const pingClass = p.ping > 150 ? ui.pingBad : p.ping > 80 ? ui.pingWarn : ui.pingGood;

          function itemSlotImg(type, count) {
            const imgName = type.toLowerCase() + '.png';
            const displayName = type.replace(/_/g, ' ').toLowerCase();
            const countHtml = count > 1 ? '<span class="' + ui.itemCount + '">' + count + '</span>' : '';
            return `<div class="${ui.invSlot}"><img class="${ui.invImg}" src="/items/${imgName}" alt="${displayName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><i class="fas fa-cube text-[13px] text-muted" style="display:none"></i>${countHtml}</div>`;
          }

          function emptySlot() {
            return `<div class="${ui.invSlot}"></div>`;
          }

          // Find item at a given slot index
          function itemAt(slotIdx) {
            return p.inventory ? p.inventory.find(s => s.slot === slotIdx) : null;
          }

          // Main inventory: slots 9-35 (3 rows of 9)
          let invHtml = `<div class="${ui.subSection}">Inventory</div>`;
          for (let row = 0; row < 3; row++) {
            invHtml += `<div class="${ui.invGrid}">`;
            for (let col = 0; col < 9; col++) {
              const idx = 9 + row * 9 + col;
              const item = itemAt(idx);
              invHtml += item ? itemSlotImg(item.type, item.amount) : emptySlot();
            }
            invHtml += '</div>';
          }
          // Hotbar: slots 0-8 (1 row of 9)
          invHtml += `<div class="${ui.invLabel}">Hotbar</div><div class="${ui.invGrid}">`;
          for (let i = 0; i < 9; i++) {
            const item = itemAt(i);
            invHtml += item ? itemSlotImg(item.type, item.amount) : emptySlot();
          }
          invHtml += '</div>';

          function armorSlotImg(type) {
            const imgName = type.toLowerCase() + '.png';
            const displayName = type.replace(/_/g, ' ').toLowerCase();
            return `<div class="${ui.invSlot}"><img class="${ui.invImg}" src="/items/${imgName}" alt="${displayName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><i class="fas fa-cube text-[13px] text-muted" style="display:none"></i></div>`;
          }

          let armorHtml = '';
          if (p.armor && p.armor.length > 0) {
            armorHtml += `<div class="${ui.subSection}">Armor</div><div class="mb-2 flex gap-1">`;
            p.armor.forEach(a => {
              armorHtml += armorSlotImg(a.type);
            });
            armorHtml += '</div>';
          }

          let offhandHtml = '';
          if (p.offhand) {
            offhandHtml += `<div class="${ui.subSection}">Offhand</div><div class="mb-2 flex gap-1">`;
            offhandHtml += armorSlotImg(p.offhand);
            offhandHtml += '</div>';
          }

          let effectsHtml = '';
          if (p.potionEffects && p.potionEffects.length > 0) {
            effectsHtml += `<div class="${ui.subSection}">Effects</div>`;
            p.potionEffects.forEach(e => {
              effectsHtml += `<span class="${ui.effect}">${e.type} ${e.amplifier + 1} (${e.duration}s)</span>`;
            });
          }

          container.innerHTML = `
            <button class="${ui.back}" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="${ui.page}"><i class="fas fa-user"></i>${escapeHtml(p.displayName)}</div>
            <div class="mb-6 grid grid-cols-2 gap-3.5 max-[860px]:grid-cols-1">
              <div class="${ui.card} p-4">
                <div class="${ui.detailGrid}">
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">UUID</span><span class="${ui.detailValue} font-mono text-[11px]">${p.uuid}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">IP</span><span class="${ui.detailValue} font-mono">${p.ip}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">World</span><span class="${ui.detailValue}">${p.world}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Coords</span><span class="${ui.detailValue} font-mono text-[12px] text-[#7fc4e8]">${Math.round(p.x)}, ${Math.round(p.y)}, ${Math.round(p.z)}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Health</span><span class="${ui.detailValue}">${p.health} / ${p.maxHealth}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Food</span><span class="${ui.detailValue}">${p.food} / 20</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Ping</span><span class="${ui.detailValue}"><span class="${ui.ping} ${pingClass}">${p.ping}ms</span></span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Game Mode</span><span class="${ui.detailValue}">${p.gamemode}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Level</span><span class="${ui.detailValue}">${p.level}</span></div>
                  <div class="${ui.detailRow}"><span class="${ui.detailLabel}">Locale</span><span class="${ui.detailValue}">${p.locale}</span></div>
                </div>
              </div>
              <div class="${ui.card} p-4">
                ${armorHtml}
                ${offhandHtml}
                ${effectsHtml || '<div class="mt-2 text-[12px] text-dim">No active effects</div>'}
              </div>
            </div>
            ${invHtml}
          `;
        } catch (e) {
          container.innerHTML = `
            <button class="${ui.back}" onclick="backToPlayers()"><i class="fas fa-arrow-left"></i> Back to Players</button>
            <div class="${ui.page}"><i class="fas fa-triangle-exclamation"></i>Error</div>
            <div class="${ui.empty}">Failed to load player detail: ${e.message}</div>
          `;
        }
      }

      function backToPlayers() {
        navigate('/players');
      }

      /* ========== USERS ========== */
      async function loadUsers() {
        try {
          const res = await apiFetch('/api/users');
          const users = await res.json();
          if (!Array.isArray(users)) throw new Error('Invalid users data');

          document.getElementById('page-users').innerHTML = `
            <div class="${ui.page} justify-between">
              <span class="flex items-center gap-2"><i class="fas fa-user-shield"></i> Users</span>
              <button class="${ui.btn} ${ui.btnPrimary}" onclick="openCreateUser()"><i class="fas fa-plus"></i> Add User</button>
            </div>
            <div class="grid gap-1.5">
              ${users.map(u => `<div class="${ui.userCard}">
                <div class="flex flex-col gap-0.5">
                  <div class="text-[13.5px] font-semibold">${escapeHtml(u.username)}</div>
                  <div class="text-[11.5px] text-dim">Role: ${u.role} | Created: ${u.createdAt ? u.createdAt.split('T')[0] : 'N/A'} | Last login: ${u.lastLogin ? u.lastLogin.split('T')[0] : 'Never'}</div>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${u.role === 'admin' || u.role === 'owner' ? `<span class="${ui.badge} ${ui.badgeAdmin}">admin</span>` : `<span class="${ui.badge} ${ui.badgeMod}">mod</span>`}
                  ${!u.enabled ? `<span class="${ui.badge} ${ui.badgeOff}">disabled</span>` : ''}
                </div>
              </div>`).join('')}
            </div>
          `;
        } catch (e) {
          document.getElementById('page-users').innerHTML = `<div class="${ui.page}"><i class="fas fa-user-shield"></i>Users</div><div class="${ui.empty}">Error loading users</div>`;
        }
      }

      function openCreateUser() {
        const modal = document.getElementById('createUserModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeCreateUser() {
        const modal = document.getElementById('createUserModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      async function createUser() {
        const username = document.getElementById('newUsername').value;
        const password = document.getElementById('newPassword').value;
        const role = document.getElementById('newRole').value;
        if (!username || !password) return alert('Fill all fields');
        const res = await apiFetch('/api/users/create', {
          method: 'POST',
          body: JSON.stringify({ username, password, role })
        });
        if (res.ok) {
          closeCreateUser();
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          loadUsers();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to create user');
        }
      }

      /* ========== WHITELIST ========== */
      async function loadWhitelist() {
        try {
          const res = await apiFetch('/api/whitelist');
          let entries = await res.json();
          if (!Array.isArray(entries)) entries = [];

          document.getElementById('page-whitelist').innerHTML = `
            <div class="${ui.page}"><i class="fas fa-shield-halved"></i>IP Whitelist</div>
            <div class="${ui.tableWrap}">
              <table class="${ui.table}">
                <thead><tr><th class="${ui.th}">IP Address</th><th class="${ui.th}">Added At</th></tr></thead>
                <tbody>
                  ${entries.length === 0 ? `<tr><td colspan="2" class="${ui.td} text-center text-dim"><i class="fas fa-shield-halved"></i> No entries</td></tr>` :
                    entries.map(e => `<tr class="${ui.row}"><td class="${ui.td} font-mono">${e.ip}</td><td class="${ui.td} text-dim">${e.addedAt || 'N/A'}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;
        } catch (e) {
          document.getElementById('page-whitelist').innerHTML = `<div class="${ui.page}"><i class="fas fa-shield-halved"></i>IP Whitelist</div><div class="${ui.empty}">Error loading whitelist</div>`;
        }
      }

      /* ========== UTILITY ========== */
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      window.onload = () => renderRoute();
      window.onbeforeunload = () => { if (statsInterval) clearInterval(statsInterval); if (playersInterval) clearInterval(playersInterval); };
    </script>
  </body>
</html>
