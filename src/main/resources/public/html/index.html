<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModPanel</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="../css/colors.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <style>
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; min-height: 100vh; }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>if(!localStorage.getItem('token')){window.location.href='/login';}else{window.location.href='/dashboard';}</script>
  </head>
  <body><div class="spinner"></div><div style="color:var(--text-secondary);font-size:.85rem">Loading...</div></body>
</html>
